# Runs the tests on every pull request and on main. They cover the installer,
# the hooks, mode switching, the context-size budgets, and the script that
# vets the monthly refresh.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Check the refresh acceptance script
        run: bash tests/test_accept_refresh.sh
      - name: Check how the refresh agent's sign-in is handled
        run: bash tests/test_run_refresh_agent.sh
