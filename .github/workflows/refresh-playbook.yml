# Monthly: an agent re-reads the sources in skills/agent-coach/references/sources.md,
# updates the playbook, and opens a pull request. A human reviews and merges it;
# nothing reaches users until then. Users then get it with `coach update`
# (or their tool's plugin/extension update).
#
# Setup: add an ANTHROPIC_API_KEY repository secret, and allow GitHub Actions to
# create pull requests (Settings > Actions > General > Workflow permissions).
name: Refresh playbook

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(python3 -m unittest *)"
          prompt: |
            Follow skills/agent-coach/references/REFRESH.md exactly. Today's date is the date of this run.

      - name: Check the refreshed playbook still passes the tests
        run: python3 -m unittest discover -s tests -v

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: playbook-refresh
          delete-branch: true
          title: "Playbook refresh (automated)"
          commit-message: "Refresh agentic-coding playbook from sources"
          body-path: .refresh-summary.md
          add-paths: |
            skills/agent-coach/references/*.md
