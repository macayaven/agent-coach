# Monthly: an agent re-reads the sources in skills/agent-coach/references/sources.md,
# updates the techniques, and a pull request is opened for a human to review.
# Nothing reaches users until that pull request is merged.
#
# The agent reads web pages, which could try to manipulate it, so the work is
# split into two jobs:
#   refresh  can call the Claude API, but can't write to the repository or run shell commands.
#   open-pr  can write to the repository, but runs no agent and has no access to the Claude API.
#            It accepts only Markdown files under references/ and runs the tests.
#
# The agent runs through the Claude Code CLI (`claude -p`), not the Claude Code
# GitHub Action, so that a Claude plan's monthly API credits can pay for it:
# those credits cover `claude -p` you run yourself but not the Action.
#
# Setup, one of:
#   Keyless (preferred): in the Claude Console, connect a GitHub Actions workload for
#     this repository's main branch, then set the repository variables
#     ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID
#     and, if the rule covers several workspaces, ANTHROPIC_WORKSPACE_ID.
#     The README has the values that the Console asks for.
#   API key: add an ANTHROPIC_API_KEY repository secret, from a dedicated key with a
#     low spend limit. It is used only while the variables above are not set.
# Optional: set the repository variable REFRESH_MODEL to a model ID to choose the model.
name: Refresh techniques

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-techniques
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # lets the job prove to the Claude API which workflow is calling
    env:
      CLAUDE_CODE_VERSION: "2.1.330"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the refresh agent
        env:
          # Keyless sign-in. No stored secret: the Claude API checks this workflow's identity.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # A stored key would override keyless sign-in, so pass it only when keyless isn't set up.
          ANTHROPIC_API_KEY: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID == '' && secrets.ANTHROPIC_API_KEY || '' }}
          REFRESH_MODEL: ${{ vars.REFRESH_MODEL }}
        run: bash .github/scripts/run-refresh-agent.sh

      - name: Show why the agent failed
        if: failure()
        run: python3 .github/scripts/show-agent-error.py "$RUNNER_TEMP/claude-execution-output.json"

      - name: Collect the refreshed files
        run: |
          mkdir -p out
          cp -R skills/agent-coach/references out/references
          cp refresh-summary.md out/ 2>/dev/null || echo "The agent wrote no summary." > out/refresh-summary.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed
          path: out/
          retention-days: 7

  open-pr:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          path: ${{ runner.temp }}/refreshed

      - name: Accept only Markdown reference files
        run: bash .github/scripts/accept-refresh.sh "$RUNNER_TEMP/refreshed" skills/agent-coach/references

      - name: Check the refreshed techniques still pass the tests
        run: python3 -m unittest discover -s tests -v

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: technique-refresh
          delete-branch: true
          title: "Technique refresh (automated)"
          commit-message: "Refresh agentic-coding techniques from sources"
          body-path: ${{ runner.temp }}/refreshed/refresh-summary.md
          add-paths: |
            skills/agent-coach/references/**
