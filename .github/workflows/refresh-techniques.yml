# Monthly: an agent re-reads the sources in skills/agent-coach/references/sources.md,
# updates the techniques, and a pull request is opened for a human to review.
# Nothing reaches users until that pull request is merged.
#
# The agent reads web pages, which could try to manipulate it, so the work is
# split into two jobs:
#   refresh  has the API key, but can't write to the repository or run shell commands.
#   open-pr  can write to the repository, but runs no agent and never sees the API key.
#            It accepts only Markdown files under references/ and runs the tests.
#
# Setup: add an ANTHROPIC_API_KEY repository secret (Settings > Secrets and
# variables > Actions). Use a dedicated key with a low spend limit.
name: Refresh techniques

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-techniques
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get today's date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The job's own read-only token. Without it the action asks for an OIDC token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow skills/agent-coach/references/REFRESH.md exactly. Today's date is ${{ steps.date.outputs.today }}.
          # "default" makes the allow list strict: anything not listed is denied.
          claude_args: >-
            --permission-mode default
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch(domain:code.claude.com),WebFetch(domain:www.anthropic.com),WebFetch(domain:anthropic.com),WebFetch(domain:learn.chatgpt.com),WebFetch(domain:developers.openai.com),WebFetch(domain:openai.com),WebFetch(domain:antigravity.google),WebFetch(domain:developers.googleblog.com),WebFetch(domain:cursor.com),WebFetch(domain:docs.github.com),WebFetch(domain:github.blog),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:agents.md),WebFetch(domain:agentskills.io),WebFetch(domain:simonwillison.net)"
            --disallowedTools "Bash,WebSearch,Read(//proc/**)"

      - name: Show why the agent failed
        if: failure()
        run: python3 .github/scripts/show-agent-error.py "$RUNNER_TEMP/claude-execution-output.json"

      - name: Collect the refreshed files
        run: |
          mkdir -p out
          cp -R skills/agent-coach/references out/references
          cp refresh-summary.md out/ 2>/dev/null || echo "The agent wrote no summary." > out/refresh-summary.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed
          path: out/
          retention-days: 7

  open-pr:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          path: ${{ runner.temp }}/refreshed

      - name: Accept only Markdown reference files
        run: bash .github/scripts/accept-refresh.sh "$RUNNER_TEMP/refreshed" skills/agent-coach/references

      - name: Check the refreshed techniques still pass the tests
        run: python3 -m unittest discover -s tests -v

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: technique-refresh
          delete-branch: true
          title: "Technique refresh (automated)"
          commit-message: "Refresh agentic-coding techniques from sources"
          body-path: ${{ runner.temp }}/refreshed/refresh-summary.md
          add-paths: |
            skills/agent-coach/references/**
